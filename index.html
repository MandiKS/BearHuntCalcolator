.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
header{text-align:center;padding:10px 6px 4px}
.crest{font-size:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
h1{font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;line-height:1.1;margin:2px 0 6px;color:var(--gold);letter-spacing:.5px;text-shadow:0 3px 0 #6b3b00,0 6px 12px rgba(0,0,0,.5)}
.sub{color:var(--mut);font-size:13.5px;margin:0 8px 10px}
.lang{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
select{font:inherit;font-weight:800;color:#3a2100;background:linear-gradient(#ffe08a,var(--gold2));border:2px solid #fff3c4;border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 #8a4f00}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;margin:14px 0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.st{font-family:'Lilita One',sans-serif;font-size:16px;color:#3a2100;background:linear-gradient(#ffe08a,var(--gold2));display:inline-block;padding:5px 14px;border-radius:999px;margin:-26px 0 10px;box-shadow:0 3px 0 #8a4f00;letter-spacing:.4px}
.f{margin:10px 0}
.f label{display:block;font-weight:800;font-size:14.5px;margin-bottom:2px}
.f small{display:block;color:var(--mut);font-size:12px;margin-bottom:5px;line-height:1.3}
input,.fixed{width:100%;font:inherit;font-weight:800;font-size:18px;color:var(--txt);background:rgba(255,255,255,.08);border:2px solid rgba(255,205,96,.55);border-radius:12px;padding:10px 12px;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,205,96,.25);background:rgba(255,255,255,.14)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--gold);font-weight:800;font-size:13px;padding:6px 0}
.big{text-align:center;margin:4px 0 12px}
.big .l{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.8px}
.big .v{font-family:'Lilita One',sans-serif;font-size:38px;color:var(--gold);text-shadow:0 3px 0 #6b3b00}
.big .n{font-size:12px;color:var(--mut)}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.1);margin:6px 0 12px}
.bar i{display:block;height:100%;transition:width .35s}
.t{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:6px 8px;align-items:center;font-size:14px}
.t .h{color:var(--mut);font-size:11.5px;font-weight:800;text-transform:uppercase}
.t .r{text-align:end;font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.tot{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:6px;font-weight:800}
.badge{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;font-weight:800;font-size:12.5px;background:rgba(95,224,138,.18);color:var(--ok);border:1px solid var(--ok)}
.badge.bad{background:rgba(255,107,107,.18);color:var(--bad);border-color:var(--bad)}
.sq{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;margin:8px 0;border-inline-start:5px solid}
.sq .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sq b{font-size:15px}.sq .num{font-family:'Lilita One',sans-serif;font-size:22px}
.sq .pr{font-size:11.5px;font-weight:800;color:#3a2100;background:var(--gold);border-radius:99px;padding:2px 9px}
.sq p{margin:4px 0 0;font-size:12.5px;color:var(--mut)}
.pbar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%}
.legend p{margin:6px 0;font-size:12.5px;color:var(--mut)}.legend b{color:var(--txt)}
.go{width:100%;margin-top:6px;font-family:'Lilita One',sans-serif;font-size:22px;letter-spacing:.6px;color:#3a2100;background:linear-gradient(#ffe08a,var(--gold2));border:2px solid #fff3c4;border-radius:16px;padding:13px;box-shadow:0 5px 0 #8a4f00,0 10px 20px rgba(0,0,0,.4);cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4f00}
.err{display:none;margin-top:12px;color:var(--bad);font-weight:800;font-size:13.5px;text-align:center}
input.miss,select.miss{border-color:var(--bad)}
#results{display:none}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;overscroll-behavior-y:none}
.sq .top{flex-wrap:wrap}
.hint{font-size:12px;color:var(--mut);margin-bottom:4px}
.hi{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,205,96,.2);border-radius:12px;padding:8px 6px 8px 12px;margin:8px 0;cursor:pointer}
.hm{flex:1;min-width:0}.hd{font-size:11.5px;color:var(--mut);font-weight:800}
.hl{font-size:13.5px;font-weight:800;margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 12px}
.hx{background:none;border:0;color:var(--mut);font-size:22px;line-height:1;padding:8px 10px;cursor:pointer}
.link{background:none;border:0;color:var(--gold);font:inherit;font-weight:800;font-size:13.5px;padding:8px 0;cursor:pointer}
@media(max-width:380px){h1{font-size:24px}.wrap{padding:10px 10px 36px}.big .v{font-size:32px}.card{padding:12px}}
footer{text-align:center;color:var(--mut);font-size:11px;margin-top:18px}
[dir=rtl] .t .r{text-align:start}
</style>
</head>
<body>
<div class="wrap" id="app">
<header>
  <div class="crest">🏹</div>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="lang"><span id="langLbl">🌐</span><select id="lang"></select></div>
</header>

<section class="card"><div class="st" id="s1"></div>
  <div id="inputs"></div>
  <button class="go" id="go" type="button"></button><div class="err" id="err"></div>
  <details><summary id="adv"></summary><div id="fixed"></div></details>
</section>

const PET={English:['Mighty Bison – skill level','Level 0–10. Each level adds +1,500 troops to your rally (max +15,000).'],'Italiano':['Bisonte Possente – livello abilità','Livello 0–10. Ogni livello aggiunge +1.500 truppe al tuo raduno (max +15.000).'],'Deutsch':['Mächtiger Bison – Fähigkeitsstufe','Stufe 0–10. Jede Stufe gibt +1.500 Truppen für deine Rally (max. +15.000).'],'العربية':['الثور الجبّار – مستوى المهارة','المستوى 0–10. كل مستوى يضيف 1500 جندي إلى حشدك (الحد الأقصى 15000).'],'Français':['Bison puissant – niveau de compétence','Niveau 0–10. Chaque niveau ajoute +1 500 troupes à votre ralliement (max +15 000).'],'한국어':['강력한 들소 – 스킬 레벨','레벨 0~10. 레벨당 집결 병력 +1,500 (최대 +15,000).'],'Filipino':['Mighty Bison – antas ng skill','Level 0–10. Bawat level ay nagdaragdag ng +1,500 troops sa rally mo (max +15,000).'],'Español':['Bisonte Poderoso – nivel de habilidad','Nivel 0–10. Cada nivel suma +1.500 tropas a tu concentración (máx. +15.000).'],'Português':['Bisão Poderoso – nível da habilidade','Nível 0–10. Cada nível soma +1.500 tropas à tua concentração (máx. +15.000).']};
for(const l in PET){TR[l].f_bison=PET[l][0];TR[l].h_bison=PET[l][1]}
const MC={English:['Minimum cavalry per joiner squad','Reserved in every joiner squad: archers cannot take this space.'],'Italiano':['Cavalleria minima per squadra partecipante','Riservata in ogni squadra partecipante: gli arceri non possono occupare questo spazio.'],'Deutsch':['Mindestkavallerie pro Beitrittstrupp','In jedem Trupp reserviert: Bogenschützen können diesen Platz nicht belegen.'],'العربية':['الحد الأدنى للفرسان في كل فرقة منضمة','محجوز في كل فرقة: لا يمكن للرماة شغل هذه المساحة.'],'Français':['Cavalerie minimale par escouade participante','Réservée dans chaque escouade : les archers ne peuvent pas prendre cette place.'],'한국어':['참가 부대당 최소 기병','각 부대에 예약됨: 궁수가 이 자리를 차지할 수 없습니다.'],'Filipino':['Minimum na cavalry kada joiner squad','Nakareserba sa bawat squad: hindi ito maaaring kunin ng archers.'],'Español':['Caballería mínima por escuadra participante','Reservada en cada escuadra: los arqueros no pueden ocupar este espacio.'],'Português':['Cavalaria mínima por esquadra participante','Reservada em cada esquadra: os arqueiros não podem ocupar este espaço.']};
for(const l in MC){TR[l].f_mincav=MC[l][0];TR[l].h_mincav=MC[l][1]}
const MODE={"English": ["Not enough archers for {n} squads at 98% (missing {m}): squads are filled to the limit with archers first, then cavalry, then infantry (minimum 1,000 each), and your rally gets the rest, at least 10% of each type.", "Squads are full at 98% archers. Extra archers now go to your rally ({p}% archers) toward 80/10/10.", "Equilibrium reached: your rally and all {n} squads are at 80/10/10."], "Italiano": ["Arceri insufficienti per le {n} squadre al 98% (mancano {m}): le squadre vengono riempite al limite con arceri, poi cavalieri, poi fanti (minimo 1.000 ciascuno); il tuo raduno prende il resto, con almeno il 10% per ogni tipo.", "Squadre piene al 98% di arceri. Gli arceri in più vanno al tuo raduno ({p}% arceri) verso 80/10/10.", "Equilibrio raggiunto: il tuo raduno e tutte le {n} squadre sono a 80/10/10."], "Deutsch": ["Nicht genug Bogenschützen für {n} Trupps zu 98 % (es fehlen {m}): Trupps werden bis zum Limit gefüllt – erst Bogenschützen, dann Kavallerie, dann Infanterie (mind. je 1.000); dein Rally bekommt den Rest, mindestens 10 % je Typ.", "Trupps sind zu 98 % mit Bogenschützen gefüllt. Weitere Bogenschützen gehen in dein Rally ({p} % Bogenschützen) Richtung 80/10/10.", "Gleichgewicht erreicht: dein Rally und alle {n} Trupps sind bei 80/10/10."], "العربية": ["عدد الرماة غير كافٍ لـ {n} فرق بنسبة 98% (ينقص {m}): تُملأ الفرق حتى الحد الأقصى بالرماة أولاً ثم الفرسان ثم المشاة (حد أدنى 1000 لكل نوع)، ويحصل حشدك على الباقي بحد أدنى 10% من كل نوع.", "الفرق ممتلئة بنسبة 98% رماة. الرماة الإضافيون يذهبون إلى حشدك ({p}% رماة) نحو 80/10/10.", "تم بلوغ التوازن: حشدك وجميع الفرق ({n}) بنسبة 80/10/10."], "Français": ["Pas assez d'archers pour {n} escouades à 98 % (il en manque {m}) : les escouades sont remplies à la limite avec archers d'abord, puis cavalerie, puis infanterie (minimum 1 000 chacune) ; votre ralliement prend le reste, au moins 10 % de chaque type.", "Escouades remplies à 98 % d'archers. Les archers en plus vont à votre ralliement ({p} % d'archers) vers 80/10/10.", "Équilibre atteint : votre ralliement et les {n} escouades sont à 80/10/10."], "한국어": ["{n}개 부대를 98%로 채울 궁수가 부족합니다({m}명 부족). 부대는 한도까지 궁수 → 기병 → 보병 순으로 채우고(각 최소 1,000), 내 집결은 나머지를 받으며 각 병종 최소 10%를 유지합니다.", "부대가 궁수 98%로 가득 찼습니다. 남는 궁수는 내 집결(궁수 {p}%)로 가며 80/10/10에 가까워집니다.", "균형 달성: 내 집결과 {n}개 부대 모두 80/10/10입니다."], "Filipino": ["Kulang ang archers para sa {n} squads sa 98% (kulang ng {m}): pinupuno ang squads hanggang limit—archers muna, saka cavalry, saka infantry (minimum 1,000 bawat isa); ang rally mo ang kukuha ng matitira, hindi bababa sa 10% bawat uri.", "Puno na ang squads sa 98% archers. Ang sobrang archers ay napupunta sa rally mo ({p}% archers) papunta sa 80/10/10.", "Naabot ang balanse: ang rally mo at lahat ng {n} squads ay nasa 80/10/10."], "Español": ["No hay arqueros suficientes para {n} escuadras al 98 % (faltan {m}): las escuadras se llenan hasta el límite con arqueros primero, luego caballería y luego infantería (mínimo 1.000 cada una); tu concentración recibe el resto, con al menos el 10 % de cada tipo.", "Escuadras llenas al 98 % de arqueros. Los arqueros extra van a tu concentración ({p} % de arqueros) hacia 80/10/10.", "Equilibrio alcanzado: tu concentración y las {n} escuadras están al 80/10/10."], "Português": ["Não há arqueiros suficientes para {n} esquadras a 98 % (faltam {m}): as esquadras são enchidas até ao limite com arqueiros primeiro, depois cavalaria e depois infantaria (mínimo 1.000 cada); a tua concentração fica com o resto, com pelo menos 10 % de cada tipo.", "Esquadras cheias a 98 % de arqueiros. Os arqueiros extra vão para a tua concentração ({p} % de arqueiros) rumo a 80/10/10.", "Equilíbrio alcançado: a tua concentração e as {n} esquadras estão a 80/10/10."]};
const EG={English:'e.g.','Italiano':'es.','Deutsch':'z. B.','العربية':'مثال:','Français':'ex.','한국어':'예:','Filipino':'hal.','Español':'p. ej.','Português':'ex.'};
function saveLast(){try{const d={};['base','inf','cav','arch','val','bison','cap','sq'].forEach(k=>d[k]=S[k]);localStorage.setItem('bhrc_last',JSON.stringify(d))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem('bhrc_last')||'null');if(!d)return;
  ['base','inf','cav','arch','val','bison','cap','sq'].forEach(k=>{const v=Number(d[k]);if(k==='bison'){if(v>=0&&v<=10){S.bison=v;$('i_bison').value=v}return}if(k==='sq'){if(v>=4&&v<=6){S.sq=v;$('i_sq').value=v}return}if(v>0){S[k]=v;$('i_'+k).value=k==='val'?v:fmt(v)}})}catch(e){}}
const DEF={mincav:1000,bison:0,base:'',inf:'',cav:'',arch:'',val:'',cap:'',bonus:3000,sq:6,res:1000,lang:'Italiano'};
const X={English:['Submit','Please fill in all fields to see the results.','Fill in your data and tap Submit to see the results.','Kingshot fan tool · App made by Mandi'],
'Italiano':['Invia','Compila tutti i campi per vedere i risultati.','Inserisci i tuoi dati e premi Invia per vedere i risultati.','Kingshot fan tool · App creata da Mandi'],
'Deutsch':['Senden','Bitte alle Felder ausfüllen, um die Ergebnisse zu sehen.','Daten eingeben und auf Senden tippen, um die Ergebnisse zu sehen.','Kingshot-Fan-Tool · App von Mandi'],
'العربية':['إرسال','يرجى ملء جميع الحقول لعرض النتائج.','أدخل بياناتك واضغط إرسال لعرض النتائج.','أداة معجبين Kingshot · تطبيق من إعداد Mandi'],
'Français':['Envoyer','Remplissez tous les champs pour voir les résultats.','Saisissez vos données et appuyez sur Envoyer pour voir les résultats.','Outil de fan Kingshot · Application créée par Mandi'],
'한국어':['제출','결과를 보려면 모든 항목을 입력하세요.','데이터를 입력하고 제출을 눌러 결과를 확인하세요.','Kingshot 팬 도구 · 제작: Mandi'],
'Filipino':['Ipadala','Punan ang lahat ng field para makita ang resulta.','Ilagay ang iyong data at pindutin ang Ipadala para makita ang resulta.','Kingshot fan tool · Gawa ni Mandi'],
'Español':['Enviar','Rellena todos los campos para ver los resultados.','Introduce tus datos y pulsa Enviar para ver los resultados.','Herramienta de fans de Kingshot · App creada por Mandi'],
'Português':['Enviar','Preencha todos os campos para ver os resultados.','Insira os seus dados e toque em Enviar para ver os resultados.','Ferramenta de fãs de Kingshot · App criada por Mandi']};
let S={...DEF};
try{const l=localStorage.getItem('bhrc_lang');if(l&&TR[l])S.lang=l}catch(e){}
function save(){try{localStorage.setItem('bhrc_lang',S.lang)}catch(e){}}
const xr=x=>x<0?-Math.round(-x):Math.round(x); // Excel ROUND
const t=k=>TR[S.lang][k];
const fmt=n=>Number(n).toLocaleString('it-IT');

const FIELDS=[['base','f_base','h_base'],['inf','f_inf','h_inf'],['cav','f_cav','h_cav'],['arch','f_arch','h_arch'],['val','f_val','h_val','sel'],['bison','f_bison','h_bison','sel'],['cap','f_cap','h_cap'],['sq','a_sq','h_asq','sel']];
const FIXED=[['bonus','a_bonus','h_abonus'],['res','a_res','h_ares'],['mincav','f_mincav','h_mincav']];

function field([id,lab,hlp,type]){
  const d=document.createElement('div');d.className='f';
  const input=type==='sel'
   ?`<select id="i_${id}" style="width:100%;font-size:18px">${id==='val'?'<option value="">—</option>':''}${(id==='sq'?[4,5,6]:id==='bison'?Array.from({length:11},(_,i)=>i):Array.from({length:10},(_,i)=>i+1)).map(n=>`<option value="${n}">${n}</option>`).join('')}</select>`
   :`<input id="i_${id}" inputmode="numeric" autocomplete="off">`;
  d.innerHTML=`<label for="i_${id}" data-t="${lab}"></label><small data-t="${hlp}"></small>${input}`;
  return d;
}
function build(){
  $('inputs').append(...FIELDS.map(field));
  $('fixed').append(...FIXED.map(field));
  const L=$('lang');Object.keys(TR).forEach(l=>L.add(new Option(l,l)));
  [...FIELDS,...FIXED].forEach(([id,,,type])=>{
    const el=$('i_'+id);
    const fixed=FIXED.some(f=>f[0]===id);
    if(type==='sel'){el.value=id==='sq'?String(S.sq):id==='bison'?'0':'';el.onchange=()=>{S[id]=el.value===''?'':+el.value;el.classList.remove('miss');stale()};return}
    if(fixed)el.value=fmt(S[id]);
    el.oninput=()=>{const v=el.value.replace(/\D/g,'');S[id]=v===''?'':Math.min(+v,999999999);el.classList.remove('miss');stale()};
    el.onblur=()=>{el.value=S[id]===''?'':fmt(S[id])};
    el.onfocus=()=>{el.select()};
  });
  L.value=S.lang;L.onchange=()=>{S.lang=L.value;save();texts();if(shown)calc()};
  $('go').onclick=submit;
  $('hList').onclick=ev=>{const x=ev.target.closest('[data-x]');if(x){H.splice(+x.dataset.x,1);saveH();renderH();return}const i=ev.target.closest('[data-n]');if(i)loadH(+i.dataset.n)};
  $('hClear').onclick=()=>{H=[];saveH();renderH()};
  ORDER.forEach((k,n)=>{const el=$('i_'+k);if(k!=='val'&&k!=='sq'&&k!=='bison')el.enterKeyHint=n<ORDER.length-1?'next':'done';el.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();n<ORDER.length-1?$('i_'+ORDER[n+1]).focus():submit()}})});
}
function texts(){
  document.documentElement.dir=RTL.includes(S.lang)?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  const x=X[S.lang];$('go').textContent=x[0];$('err').textContent=x[1];$('subtitle').textContent=x[2];$('foot').textContent=x[3];
  const m={title:'title',s1:'s1',s2:'s2',s3:'s3',s4:'s4',adv:'adv',rsizeL:'r_size',rsizeN:'h_rsize',rnote:'r_note',jtotL:'j_total',lgt:'lg_tip',lgtd:'lg_tip_d'};
  for(const k in m)$(k).textContent=t(m[k]);
  document.title=t('title');renderH();
  $('i_sq').parentElement.querySelector('small').textContent=t('h_asq')+' ('+SQN[S.lang]+')';
  ['base','inf','cav','arch','cap'].forEach(k=>{$('i_'+k).placeholder=EG[S.lang]+' '+fmt(EX[k])});
}
const COL={inf:'var(--inf)',cav:'var(--cav)',arch:'var(--arc)'};
let shown=false;
const ORDER=['base','inf','cav','arch','val','bison','cap','sq'];
function saveH(){try{localStorage.setItem('bhrc_hist',JSON.stringify(H))}catch(e){}}
function addHist(){
  const d={};ORDER.forEach(k=>d[k]=S[k]);const key=JSON.stringify(d);
  H=H.filter(e=>JSON.stringify(e.d)!==key);
  H.unshift({t:Date.now(),d,r:LAST});H=H.slice(0,30);saveH();saveLast();renderH();
}
function renderH(){
  const x=HX[S.lang];$('hist').style.display=H.length?'block':'none';
  $('hT').textContent=x[0];$('hClear').textContent='🗑 '+x[1];$('hHint').textContent=x[2];
  $('hList').innerHTML=H.map((e,n)=>`<div class="hi" data-n="${n}"><div class="hm"><div class="hd">${new Date(e.t).toLocaleString(x[3],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · ${fmt(e.r.size)}</div>
   <div class="hl"><span style="color:var(--inf)">${fmt(e.r.i)}</span><span style="color:var(--cav)">${fmt(e.r.c)}</span><span style="color:var(--arc)">${fmt(e.r.a)}</span></div></div><button class="hx" data-x="${n}" aria-label="x">✕</button></div>`).join('');
}
function loadH(n){
  const e=H[n];if(!e)return;
  ORDER.forEach(k=>{const v=e.d[k]??(k==='sq'?6:k==='bison'?0:'');S[k]=v;const el=$('i_'+k);el.value=(k==='val'||k==='sq'||k==='bison')?v:fmt(v);el.classList.remove('miss')});
  $('err').style.display='none';calc();shown=true;$('results').style.display='block';
  $('results').scrollIntoView({behavior:'smooth',block:'start'});
}
function stale(){shown=false;$('results').style.display='none';$('err').style.display='none'}
function submit(){
  const need=['base','inf','cav','arch','val','cap'];
  const miss=need.filter(k=>!(Number(S[k])>0));
  need.forEach(k=>$('i_'+k).classList.toggle('miss',miss.includes(k)));
  if(miss.length){$('err').style.display='block';$('results').style.display='none';shown=false;$('i_'+miss[0]).focus();return}
  $('err').style.display='none';document.activeElement&&document.activeElement.blur();
  calc();shown=true;addHist();$('results').style.display='block';
  $('results').scrollIntoView({behavior:'smooth',block:'start'});
}
function calc(){
  const {base,inf,cav,arch,val,cap,bonus,sq,res,bison}=S;
  const vb=(val>=1&&val<=10)?val*bonus:0, size=base+vb+(bison>=0&&bison<=10?bison*1500:0);
  const N=sq||1, mc=S.mincav>=0?S.mincav:0;
  const a98=cap-res-mc, ownMin=Math.max(1000,xr(size*.1)), o80=xr(size*.8);
  const full=arch>=N*a98+ownMin, eq=arch>=N*a98+o80;
  let ap,cp,ip,ri,rc,ra,a,c,i,ph;
  if(eq){ph=3;a=Math.min(xr(cap*.8),a98);c=Math.min(Math.max(mc,xr(cap*.1)),Math.floor(cav/N));i=Math.min(cap-a-c,Math.floor(inf/N))}
  else{ph=full?2:1;a=Math.min(a98,Math.floor((arch-Math.min(ownMin,arch))/N));c=Math.min(mc,Math.floor(cav/N));i=Math.min(res,Math.floor(inf/N));
    let E=cap-a-c-i;const take=l=>Math.max(0,Math.min(E,Math.floor(l/N)));let x;
    x=take(cav-N*c-ownMin);c+=x;E-=x;x=take(inf-N*i-ownMin);i+=x;E-=x;
    x=take(cav-N*c);c+=x;E-=x;x=take(inf-N*i);i+=x;E-=x}
  const la=arch-N*a,cL=cav-N*c,iL=inf-N*i;
  ra=Math.min(o80,la);const R=size-ra;
  ri=Math.min(ownMin,iL);rc=R-ri;
  if(rc>cL){rc=cL;ri=Math.min(iL,R-rc)}
  ap=xr(ra/size*100);cp=xr(rc/size*100);ip=100-ap-cp;
  const mt=MODE[S.lang];
  $('mode').style.color=ph===1?'var(--gold)':'var(--ok)';
  $('mode').textContent=mt[ph-1].replace('{n}',N).replace('{m}',fmt(Math.max(0,N*a98+ownMin-arch))).replace('{p}',ap);
  const jt=i+c+a;LAST={size,i,c,a};

  $('rsize').textContent=fmt(size);
  const rows=[['inf',t('t_inf'),ip,ri],['cav',t('t_cav'),cp,rc],['arch',t('t_arch'),ap,ra]];
  $('bar1').innerHTML=rows.map(r=>`<i style="width:${r[2]}%;background:${COL[r[0]]}"></i>`).join('');
  $('tbl').innerHTML=`<span class="h"></span><span class="h r">${t('r_ratio')}</span><span class="h r">${t('r_troops')}</span>`+
    rows.map(r=>`<span><span class="dot" style="background:${COL[r[0]]}"></span>${r[1]}</span><span class="r">${r[2]}%</span><span class="r">${fmt(r[3])}</span>`).join('')+
    `<span class="tot">${t('t_total')}</span><span class="tot r">${ip+cp+ap}%</span><span class="tot r">${fmt(ri+rc+ra)}</span>`;
  const okR=ip+cp+ap===100;
  setB('rbadge',okR,okR?t('ok'):t('bad_ratio'));

  const J=[['arch',a,'p1','n_arch'],['cav',c,'p2','n_cav'],['inf',i,'p3','n_inf']];
  $('bar2').innerHTML=J.slice().reverse().map(j=>`<i style="width:${Math.max(0,j[1])/cap*100}%;background:${COL[j[0]]}"></i>`).join('');
  $('squad').innerHTML=J.map(j=>{const p=cap?j[1]/cap:0;return `<div class="sq" style="border-color:${COL[j[0]]}">
   <div class="top"><b>${t('t_'+j[0])}</b><span class="pr">${t(j[2])}</span><span class="num" style="color:${COL[j[0]]}">${fmt(j[1])}</span></div>
   <div class="pbar"><i style="width:${Math.max(0,p*100)}%;background:${COL[j[0]]}"></i></div>
   <p>${(p*100).toFixed(1)}% ${t('j_pct').replace(/^%\s*/,'')} · ${t(j[3])}</p></div>`}).join('');
  $('jtot').textContent=fmt(jt)+' / '+fmt(cap);
  const okJ=jt===cap;
  setB('jbadge',okJ,okJ?t('ok'):t('bad_cap'));
}
function setB(id,ok,txt){const e=$(id);e.className='badge'+(ok?'':' bad');e.textContent=(ok?'✔ ':'⚠ ')+txt}
build();restore();texts();
</script>
